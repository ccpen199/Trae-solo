version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sms-platform-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: SmsRoot@2024
      MYSQL_DATABASE: sms_platform
      MYSQL_USER: sms_admin
      MYSQL_PASSWORD: SmsAdmin@2024
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pSmsRoot@2024"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms-network

  redis:
    image: redis:7.2-alpine
    container_name: sms-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms-network

networks:
  sms-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

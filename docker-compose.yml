    container_name: video_platform_recommend_engine
    ports:
      - "9880:9880"
    environment:
      - PORT=9880
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=video_platform
      - DB_USER=vp_admin
      - DB_PASSWORD=Vp_Admin_2024_Secure
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Redis_Secure_2024_Pass

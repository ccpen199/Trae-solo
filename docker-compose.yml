version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: coldchain-postgres
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coldchain-network

  redis:
    image: redis:6-alpine
    container_name: coldchain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coldchain-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: coldchain-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - coldchain-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coldchain-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coldchain
      SPRING_DATASOURCE_USERNAME: coldchain
      SPRING_DATASOURCE_PASSWORD: coldchain123
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - coldchain-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coldchain-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - coldchain-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  coldchain-network:
    driver: bridge

      context: ./engines/transcoding-engine
      dockerfile: Dockerfile
    container_name: video_platform_transcoding_engine
    ports:
      - "9879:9879"
    environment:
      - PORT=9879
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=video_platform
      - DB_USER=vp_admin
      - DB_PASSWORD=Vp_Admin_2024_Secure
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Redis_Secure_2024_Pass
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=mq_admin
      - RABBITMQ_PASSWORD=Mq_Admin_2024_Secure
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minio_admin
      - MINIO_SECRET_KEY=Minio_Admin_2024_Secure
      - MINIO_BUCKET=videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:

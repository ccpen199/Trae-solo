server:
  port: 8086
  servlet:
    context-path: /monitor

spring:
  application:
    name: platform-monitor
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/monitor_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 5
      timeout: 30s
      lettuce:
        pool:
          max-active: 50
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
        file-extension: yml

  rocketmq:
    name-server: 127.0.0.1:9876
    producer:
      group: monitor-producer-group
      send-message-timeout: 3000
      retry-times-when-send-failed: 2
    consumer:
      group: monitor-consumer-group

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.guizhou.platform.monitor.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 服务可用性SLA监控服务API
    description: 贵州省数字服务平台-服务监控与SLA考核接口文档
    version: 1.0.0
    concat: 技术支持部
    terms-of-service-url: http://www.guizhou.gov.cn

monitor:
  probe:
    interval: 30000
    timeout: 5000
    retry-count: 2
    thread-pool-size: 10
  alert:
    enabled: true
    channels: SMS,EMAIL,DINGTALK,WEBHOOK
    sms-template: 【贵州数字平台】服务{serviceName}发生{level}告警：{message}
    email-subject: 【贵州数字平台】服务告警通知
    dingtalk-webhook: https://oapi.dingtalk.com/robot/send?access_token=
    webhook-url: http://127.0.0.1:8090/alert/callback
  sla:
    auto-check-enabled: true
    check-cron: 0 0 2 1 * ?
    default-availability-target: 99.95
    default-response-time-target: 200
    default-error-rate-target: 1.0

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
        step: 30s

logging:
  level:
    com.guizhou.platform.monitor: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

server:
  port: 8090
  servlet:
    context-path: /living

spring:
  application:
    name: service-living
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
        file-extension: yml
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8725
      eager: true
      datasource:
        ds1:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: service-living-sentinel
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: flow

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/living_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 8
      timeout: 30s
      lettuce:
        pool:
          max-active: 50
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

    elasticsearch:
      uris: http://127.0.0.1:9200
      username: elastic
      password: elastic
      connection-timeout: 30s
      socket-timeout: 30s

  rocketmq:
    name-server: 127.0.0.1:9876
    producer:
      group: living-producer-group
      send-message-timeout: 3000
      retry-times-when-send-failed: 2
    consumer:
      group: living-consumer-group

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.guizhou.platform.living.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 生活服务模块API
    description: 贵州省数字服务平台-生活服务接口文档
    version: 1.0.0
    concat: 技术支持部
    terms-of-service-url: http://www.guizhou.gov.cn

living:
  elasticsearch:
    index-prefix: living_
    sync-interval: 60000
  booking:
    auto-cancel-minutes: 30
    auto-complete-hours: 48
  evaluate:
    anonymous-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.guizhou.platform.living: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

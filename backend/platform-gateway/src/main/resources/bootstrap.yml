spring:
  application:
    name: platform-gateway
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
        file-extension: yml
        shared-configs:
          - data-id: common.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: redis.yml
            group: DEFAULT_GROUP
            refresh: true

server:
  port: 8080

spring:
  application:
    name: platform-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: guizhou-platform
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true
      filter:
        enabled: false
      scg:
        fallback:
          mode: response
          response-body: '{"code":429,"message":"系统繁忙，请稍后再试","data":null}'
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: platform-auth
          uri: lb://platform-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: platform-data-share
          uri: lb://platform-data-share
          predicates:
            - Path=/api/data/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: '#{@ipKeyResolver}'
        - id: platform-certificate
          uri: lb://platform-certificate
          predicates:
            - Path=/api/cert/**
          filters:
            - StripPrefix=2
        - id: platform-subsidy
          uri: lb://platform-subsidy
          predicates:
            - Path=/api/subsidy/**
          filters:
            - StripPrefix=2
        - id: platform-ticket
          uri: lb://platform-ticket
          predicates:
            - Path=/api/ticket/**
          filters:
            - StripPrefix=2
        - id: platform-monitor
          uri: lb://platform-monitor
          predicates:
            - Path=/api/monitor/**
          filters:
            - StripPrefix=2
        - id: service-government
          uri: lb://service-government
          predicates:
            - Path=/api/government/**
          filters:
            - StripPrefix=2
        - id: service-payment
          uri: lb://service-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=2
        - id: service-living
          uri: lb://service-living
          predicates:
            - Path=/api/living/**
          filters:
            - StripPrefix=2
        - id: service-subsidy-verify
          uri: lb://service-subsidy-verify
          predicates:
            - Path=/api/subsidy-verify/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

gateway:
  auth:
    enabled: true
    token-header: Authorization
    token-prefix: 'Bearer '
    secret-key: guizhou-platform-secret-key-2024
    expire-time: 7200
    white-list:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/captcha
      - /api/auth/refresh
      - /*/v3/api-docs/**
      - /v3/api-docs/**
      - /swagger-resources/**
      - /swagger-ui/**
      - /doc.html
      - /webjars/**
      - /actuator/**
  rate-limit:
    enabled: true
    default-replenish-rate: 10
    default-burst-capacity: 20
    ip-rate-limit:
      enabled: true
      replenish-rate: 50
      burst-capacity: 100

logging:
  level:
    root: info
    com.guizhou.platform: debug
    org.springframework.cloud.gateway: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

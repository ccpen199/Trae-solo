spring:
  application:
    name: coldchain-logistics
  
  datasource:
    url: jdbc:sqlite:/Users/chen/Documents/trae_projects/local_projects/xm-7012/data/app.sqlite
    username: 
    password: 
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLiteDialect
        format_sql: true

server:
  port: 7012
  servlet:
    context-path: /api

jwt:
  secret: coldchain_secret_key_2024_secure
  expiration: 86400

logging:
  level:
    com.coldchain: info
    org.hibernate.SQL: warn

temperature:
  collection:
    interval: 30000
    batch-size: 50

alarm:
  levels:
    level1: 2
    level2: 5
    level3: 10

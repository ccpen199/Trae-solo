server:
  port: 12215

spring:
  application:
    name: bizcard-management
  
  profiles:
    active: h2
  
  datasource:
    url: jdbc:postgresql://localhost:5432/bizcard_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      connect-timeout: 2000
      timeout: 2000

  h2:
    console:
      enabled: false
      path: /h2-console

jwt:
  secret: bizcard-secret-key-2024-spring-boot-jwt-token-secret-must-be-at-least-256-bits-for-security
  expiration: 604800000

logging:
  level:
    com.bizcard: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: h2
  
  datasource:
    url: jdbc:h2:mem:bizcard_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      connect-timeout: 1000
      timeout: 1000

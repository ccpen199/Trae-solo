spring:
  application:
    name: retailpos-backend
  profiles:
    active: h2
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # 端口配置入口: 可通过环境变量 DB_PORT 修改，默认值 55543
    # Docker映射端口: 55543:5432 (外部:内部)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55543}/${DB_NAME:retailpos}
    username: ${DB_USER:posuser}
    password: ${DB_PASSWORD:pos2024secure}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  redis:
    host: ${REDIS_HOST:localhost}
    # 端口配置入口: 可通过环境变量 REDIS_PORT 修改，默认值 66637
    # Docker映射端口: 66637:6379 (外部:内部)
    port: ${REDIS_PORT:66637}
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  # 端口配置入口: 可通过环境变量 SERVER_PORT 修改，默认值 18888
  # Docker映射端口: 18888:18080 (外部:内部)
  # 避坑提示: 不使用 8080, 8888 等常见端口
  port: ${SERVER_PORT:18888}
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.retailpos.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.retailpos: DEBUG
    com.retailpos.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

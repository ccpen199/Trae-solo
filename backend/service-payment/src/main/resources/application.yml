server:
  port: 8086
  servlet:
    context-path: /payment

spring:
  profiles:
    active: dev
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8722
      eager: true
      datasource:
        ds1:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: service-payment-sentinel
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: flow

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/payment_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 5
      timeout: 30s
      lettuce:
        pool:
          max-active: 50
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

  rocketmq:
    name-server: 127.0.0.1:9876
    producer:
      group: payment-producer-group
      send-message-timeout: 3000
      retry-times-when-send-failed: 2
    consumer:
      group: payment-consumer-group

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.guizhou.platform.payment.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 便民缴费服务API
    description: 贵州省数字服务平台-便民缴费接口文档
    version: 1.0.0
    concat: 技术支持部
    terms-of-service-url: http://www.guizhou.gov.cn

payment:
  channel:
    wechat:
      enabled: true
      app-id: wx_placeholder
      mch-id: mch_placeholder
      api-key: key_placeholder
      notify-url: http://127.0.0.1:8086/payment/api/notify/wechat
    alipay:
      enabled: true
      app-id: ali_placeholder
      private-key: pk_placeholder
      public-key: pbk_placeholder
      notify-url: http://127.0.0.1:8086/payment/api/notify/alipay
    unionpay:
      enabled: true
      merchant-id: union_placeholder
      cert-path: /certs/unionpay.pfx
      notify-url: http://127.0.0.1:8086/payment/api/notify/unionpay
  bill:
    query-timeout: 10000
    retry-times: 2
    cache-ttl: 300

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.guizhou.platform.payment: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

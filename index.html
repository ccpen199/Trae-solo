<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多语言语音翻译</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .language-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .language-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 250px;
        }

        .language-selector label {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .language-selector select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .language-selector select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .swap-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .translation-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .translation-area {
                grid-template-columns: 1fr;
            }
        }

        .text-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .text-box h3 {
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .text-box textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1rem;
            resize: vertical;
            font-family: inherit;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .text-box textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .text-box textarea:disabled {
            background: #f8f9fa;
            color: #666;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mic-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }

        .mic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ee5a6f 0%, #d64550 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(238, 90, 111, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(238, 90, 111, 0);
            }
        }

        .speak-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
        }

        .speak-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(78, 205, 196, 0.4);
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .clear-btn {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(149, 165, 166, 0.4);
        }

        .translate-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .translate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .translate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        .translate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .feature-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .feature {
            text-align: center;
            color: white;
            opacity: 0.9;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .feature-text {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 多语言语音翻译</h1>
            <p>支持语音识别、语音合成的实时翻译工具</p>
            <div class="feature-icons">
                <div class="feature">
                    <div class="feature-icon">🎤</div>
                    <div class="feature-text">语音识别</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔄</div>
                    <div class="feature-text">实时翻译</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔊</div>
                    <div class="feature-text">语音合成</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🌐</div>
                    <div class="feature-text">多语言支持</div>
                </div>
            </div>
        </div>

        <div class="content">
            <div id="status" class="status"></div>

            <div class="language-section">
                <div class="language-selector">
                    <label for="sourceLang">源语言</label>
                    <select id="sourceLang">
                        <option value="zh-CN">中文 (简体)</option>
                        <option value="zh-TW">中文 (繁体)</option>
                        <option value="en-US">英语 (美国)</option>
                        <option value="en-GB">英语 (英国)</option>
                        <option value="ja-JP">日语</option>
                        <option value="ko-KR">韩语</option>
                        <option value="fr-FR">法语</option>
                        <option value="de-DE">德语</option>
                        <option value="es-ES">西班牙语</option>
                        <option value="pt-BR">葡萄牙语 (巴西)</option>
                        <option value="pt-PT">葡萄牙语 (葡萄牙)</option>
                        <option value="ru-RU">俄语</option>
                        <option value="it-IT">意大利语</option>
                        <option value="nl-NL">荷兰语</option>
                        <option value="pl-PL">波兰语</option>
                        <option value="tr-TR">土耳其语</option>
                        <option value="ar-SA">阿拉伯语</option>
                        <option value="hi-IN">印地语</option>
                        <option value="th-TH">泰语</option>
                        <option value="vi-VN">越南语</option>
                    </select>
                </div>

                <button class="swap-btn" id="swapBtn" title="交换语言">🔄</button>

                <div class="language-selector">
                    <label for="targetLang">目标语言</label>
                    <select id="targetLang">
                        <option value="en-US">英语 (美国)</option>
                        <option value="en-GB">英语 (英国)</option>
                        <option value="zh-CN">中文 (简体)</option>
                        <option value="zh-TW">中文 (繁体)</option>
                        <option value="ja-JP">日语</option>
                        <option value="ko-KR">韩语</option>
                        <option value="fr-FR">法语</option>
                        <option value="de-DE">德语</option>
                        <option value="es-ES">西班牙语</option>
                        <option value="pt-BR">葡萄牙语 (巴西)</option>
                        <option value="pt-PT">葡萄牙语 (葡萄牙)</option>
                        <option value="ru-RU">俄语</option>
                        <option value="it-IT">意大利语</option>
                        <option value="nl-NL">荷兰语</option>
                        <option value="pl-PL">波兰语</option>
                        <option value="tr-TR">土耳其语</option>
                        <option value="ar-SA">阿拉伯语</option>
                        <option value="hi-IN">印地语</option>
                        <option value="th-TH">泰语</option>
                        <option value="vi-VN">越南语</option>
                    </select>
                </div>
            </div>

            <div class="translation-area">
                <div class="text-box">
                    <h3>📝 源文本</h3>
                    <textarea id="sourceText" placeholder="在此输入文本，或点击麦克风按钮进行语音输入..."></textarea>
                    <div class="controls">
                        <button class="control-btn mic-btn" id="startMicBtn">
                            <span>🎤</span>
                            <span>开始录音</span>
                        </button>
                        <button class="control-btn mic-btn" id="stopMicBtn" style="display: none;">
                            <span>⏹️</span>
                            <span>停止录音</span>
                        </button>
                        <button class="control-btn clear-btn" id="clearSourceBtn">
                            <span>🗑️</span>
                            <span>清空</span>
                        </button>
                    </div>
                </div>

                <div class="text-box">
                    <h3>💬 翻译结果</h3>
                    <textarea id="targetText" placeholder="翻译结果将显示在这里..." disabled></textarea>
                    <div class="controls">
                        <button class="control-btn speak-btn" id="speakTargetBtn">
                            <span>🔊</span>
                            <span>朗读</span>
                        </button>
                        <button class="control-btn copy-btn" id="copyTargetBtn">
                            <span>📋</span>
                            <span>复制</span>
                        </button>
                        <button class="control-btn clear-btn" id="clearTargetBtn">
                            <span>🗑️</span>
                            <span>清空</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="translate-section">
                <button class="translate-btn" id="translateBtn">
                    🔄 翻译
                </button>
            </div>
        </div>

        <div class="footer">
            <p>💡 提示：请使用现代浏览器（Chrome、Edge、Safari）以获得最佳体验</p>
            <p>语音识别功能需要浏览器支持 Web Speech API</p>
        </div>
    </div>

    <script>
        // DOM 元素
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const sourceText = document.getElementById('sourceText');
        const targetText = document.getElementById('targetText');
        const translateBtn = document.getElementById('translateBtn');
        const swapBtn = document.getElementById('swapBtn');
        const startMicBtn = document.getElementById('startMicBtn');
        const stopMicBtn = document.getElementById('stopMicBtn');
        const clearSourceBtn = document.getElementById('clearSourceBtn');
        const clearTargetBtn = document.getElementById('clearTargetBtn');
        const speakTargetBtn = document.getElementById('speakTargetBtn');
        const copyTargetBtn = document.getElementById('copyTargetBtn');
        const statusDiv = document.getElementById('status');

        // 语音识别相关变量
        let recognition = null;
        let isRecording = false;

        // 初始化语音识别
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = sourceLang.value;

                recognition.onstart = function() {
                    showStatus('正在听...请说话', 'info');
                    startMicBtn.style.display = 'none';
                    stopMicBtn.style.display = 'flex';
                    startMicBtn.classList.add('recording');
                    isRecording = true;
                };

                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    sourceText.value = finalTranscript + interimTranscript;
                };

                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    let errorMsg = '语音识别出错';
                    switch(event.error) {
                        case 'not-allowed':
                            errorMsg = '请允许麦克风权限';
                            break;
                        case 'no-speech':
                            errorMsg = '没有检测到语音';
                            break;
                        case 'audio-capture':
                            errorMsg = '无法访问麦克风';
                            break;
                        case 'network':
                            errorMsg = '网络连接失败';
                            break;
                    }
                    showStatus(errorMsg, 'error');
                    stopRecording();
                };

                recognition.onend = function() {
                    if (isRecording) {
                        // 如果还在录音状态，重新开始
                        try {
                            recognition.start();
                        } catch(e) {
                            console.log('无法重新启动识别:', e);
                        }
                    } else {
                        showStatus('录音已停止', 'info');
                        setTimeout(() => {
                            hideStatus();
                        }, 2000);
                    }
                };
            } else {
                showStatus('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器', 'error');
                startMicBtn.disabled = true;
                startMicBtn.style.opacity = '0.5';
            }
        }

        // 开始录音
        function startRecording() {
            if (!recognition) {
                initSpeechRecognition();
                if (!recognition) return;
            }

            recognition.lang = sourceLang.value;
            try {
                recognition.start();
            } catch(e) {
                console.error('启动录音失败:', e);
                showStatus('启动录音失败: ' + e.message, 'error');
            }
        }

        // 停止录音
        function stopRecording() {
            if (recognition) {
                isRecording = false;
                recognition.stop();
                startMicBtn.style.display = 'flex';
                stopMicBtn.style.display = 'none';
                startMicBtn.classList.remove('recording');
            }
        }

        // 显示状态信息
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        // 隐藏状态信息
        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        // 交换语言
        function swapLanguages() {
            const tempLang = sourceLang.value;
            const tempText = sourceText.value;
            
            sourceLang.value = targetLang.value;
            targetLang.value = tempLang;
            
            sourceText.value = targetText.value;
            targetText.value = tempText;

            if (recognition) {
                recognition.lang = sourceLang.value;
            }

            showStatus('语言已交换', 'success');
            setTimeout(() => hideStatus(), 2000);
        }

        // 翻译文本
        async function translateText() {
            const text = sourceText.value.trim();
            if (!text) {
                showStatus('请输入要翻译的文本', 'error');
                return;
            }

            translateBtn.disabled = true;
            translateBtn.textContent = '🔄 翻译中...';
            showStatus('正在翻译...', 'info');

            try {
                const sourceLangCode = sourceLang.value.split('-')[0];
                const targetLangCode = targetLang.value.split('-')[0];

                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLangCode}|${targetLangCode}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200 && data.responseData) {
                    targetText.value = data.responseData.translatedText;
                    showStatus('翻译完成！', 'success');
                    setTimeout(() => hideStatus(), 2000);
                } else {
                    throw new Error(data.responseDetails || '翻译失败');
                }
            } catch (error) {
                console.error('翻译错误:', error);
                showStatus('翻译失败: ' + error.message + '。请稍后重试。', 'error');
            } finally {
                translateBtn.disabled = false;
                translateBtn.textContent = '🔄 翻译';
            }
        }

        // 语音合成
        function speakText() {
            const text = targetText.value.trim();
            if (!text) {
                showStatus('没有可朗读的文本', 'error');
                return;
            }

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = targetLang.value;
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;

                utterance.onerror = function(event) {
                    console.error('语音合成错误:', event);
                    showStatus('朗读失败', 'error');
                };

                utterance.onend = function() {
                    showStatus('朗读完成', 'success');
                    setTimeout(() => hideStatus(), 2000);
                };

                showStatus('正在朗读...', 'info');
                speechSynthesis.speak(utterance);
            } else {
                showStatus('您的浏览器不支持语音合成', 'error');
            }
        }

        // 复制文本
        async function copyText() {
            const text = targetText.value.trim();
            if (!text) {
                showStatus('没有可复制的文本', 'error');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showStatus('已复制到剪贴板！', 'success');
                setTimeout(() => hideStatus(), 2000);
            } catch (error) {
                console.error('复制失败:', error);
                showStatus('复制失败', 'error');
            }
        }

        // 清空源文本
        function clearSourceText() {
            sourceText.value = '';
        }

        // 清空目标文本
        function clearTargetText() {
            targetText.value = '';
        }

        // 事件监听
        swapBtn.addEventListener('click', swapLanguages);
        translateBtn.addEventListener('click', translateText);
        startMicBtn.addEventListener('click', startRecording);
        stopMicBtn.addEventListener('click', stopRecording);
        clearSourceBtn.addEventListener('click', clearSourceText);
        clearTargetBtn.addEventListener('click', clearTargetText);
        speakTargetBtn.addEventListener('click', speakText);
        copyTargetBtn.addEventListener('click', copyText);

        // 源文本输入时的处理
        sourceText.addEventListener('input', function() {
            if (this.value.trim()) {
                translateBtn.disabled = false;
            }
        });

        // 回车键翻译
        sourceText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                translateText();
            }
        });

        // 初始化
        initSpeechRecognition();
    </script>
</body>
</html>

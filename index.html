<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="多语言语音翻译工具 - 支持语音识别、语音合成的实时翻译网页应用">
    <meta name="keywords" content="翻译,语音翻译,多语言,语音识别,语音合成,对话翻译">
    <meta name="author" content="TranslateApp">
    
    <title>多语言语音翻译 | 实时语音翻译工具</title>
    
    <!-- CSS 变量文件 -->
    <link rel="stylesheet" href="./css/variables.css">
    
    <!-- 组件样式文件 -->
    <link rel="stylesheet" href="./css/components/conversation.css">
    <link rel="stylesheet" href="./css/components/history.css">
    <link rel="stylesheet" href="./css/components/toolbar.css">
    
    <!-- 主样式文件 -->
    <link rel="stylesheet" href="./css/main.css">
    
    <!-- 预加载关键资源 -->
    <link rel="preload" href="./css/main.css" as="style">
    <link rel="preload" href="./js/app.js" as="script">
    
    <!-- 防止主题闪烁 -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme_mode') || 'light';
                const html = document.documentElement;
                html.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    html.classList.add('theme--dark');
                }
            } catch (e) {
                // 忽略错误，使用默认主题
            }
        })();
    </script>
</head>
<body>
    <!-- 顶部工具栏 -->
    <nav class="toolbar" role="navigation" aria-label="工具栏">
        <div class="toolbar__container">
            <div class="toolbar__left">
                <a href="#" class="toolbar__logo" aria-label="返回首页">
                    <span class="toolbar__logo__icon" aria-hidden="true">🌍</span>
                    <span class="toolbar__logo__text">语音翻译</span>
                </a>
            </div>
            
            <div class="toolbar__right">
                <!-- 模式切换按钮 -->
                <div class="mode-toggle" role="group" aria-label="翻译模式">
                    <button type="button" class="mode-toggle__option mode-toggle__option--active" data-mode="standard" aria-pressed="true">
                        <span class="mode-toggle__option__icon" aria-hidden="true">📝</span>
                        <span class="mode-toggle__option__text">标准</span>
                    </button>
                    <button type="button" class="mode-toggle__option" data-mode="conversation" aria-pressed="false">
                        <span class="mode-toggle__option__icon" aria-hidden="true">💬</span>
                        <span class="mode-toggle__option__text">对话</span>
                    </button>
                </div>
                
                <!-- 历史记录按钮 -->
                <button type="button" class="settings-btn" id="historyBtn" aria-label="历史记录">
                    <span aria-hidden="true">📚</span>
                </button>
                
                <!-- 主题切换 -->
                <div class="theme-toggle">
                    <button type="button" class="theme-toggle__btn" id="themeToggleBtn" aria-label="切换主题">
                        <span class="theme-toggle__btn__icon" id="themeIcon" aria-hidden="true">☀️</span>
                        <span class="theme-toggle__btn__text" id="themeText">浅色</span>
                    </button>
                    <div class="theme-toggle__menu" id="themeMenu" role="menu" aria-label="主题选择">
                        <button type="button" class="theme-toggle__option" data-theme="light" role="menuitem">
                            <span class="theme-toggle__option__icon" aria-hidden="true">☀️</span>
                            <span>浅色模式</span>
                            <span class="theme-toggle__option__check">✓</span>
                        </button>
                        <button type="button" class="theme-toggle__option" data-theme="dark" role="menuitem">
                            <span class="theme-toggle__option__icon" aria-hidden="true">🌙</span>
                            <span>深色模式</span>
                            <span class="theme-toggle__option__check">✓</span>
                        </button>
                        <button type="button" class="theme-toggle__option" data-theme="system" role="menuitem">
                            <span class="theme-toggle__option__icon" aria-hidden="true">💻</span>
                            <span>跟随系统</span>
                            <span class="theme-toggle__option__check">✓</span>
                        </button>
                    </div>
                </div>
                
                <!-- 设置按钮 -->
                <button type="button" class="settings-btn" id="settingsBtn" aria-label="设置">
                    <span aria-hidden="true">⚙️</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content" role="main">
        <div class="container">
            <!-- 状态提示区域 -->
            <div id="status" class="status" role="alert" aria-live="polite"></div>
            
            <!-- 标准翻译模式 -->
            <section id="standardMode" class="mode-section" aria-label="标准翻译模式">
                <!-- 头部区域 -->
                <header class="header">
                    <h1 class="header__title">
                        <span class="header__icon">🌍</span>
                        多语言语音翻译
                    </h1>
                    <p class="header__subtitle">
                        支持语音识别、语音合成的实时翻译工具
                    </p>
                    
                    <!-- 功能图标区域 -->
                    <div class="feature-icons" aria-label="功能特性">
                        <div class="feature">
                            <span class="feature__icon" aria-hidden="true">🎤</span>
                            <span class="feature__text">语音识别</span>
                        </div>
                        <div class="feature">
                            <span class="feature__icon" aria-hidden="true">🔄</span>
                            <span class="feature__text">实时翻译</span>
                        </div>
                        <div class="feature">
                            <span class="feature__icon" aria-hidden="true">🔊</span>
                            <span class="feature__text">语音合成</span>
                        </div>
                        <div class="feature">
                            <span class="feature__icon" aria-hidden="true">🌐</span>
                            <span class="feature__text">多语言支持</span>
                        </div>
                    </div>
                </header>
                
                <!-- 主要内容区域 -->
                <div class="container__content">
                    <!-- 语言选择区域 -->
                    <section class="language-section" aria-label="语言选择">
                        <!-- 源语言选择器 -->
                        <div class="language-selector">
                            <label for="sourceLang" class="language-selector__label">
                                源语言
                            </label>
                            <select id="sourceLang" class="language-selector__select" aria-label="选择源语言">
                                <!-- 语言选项将由 JavaScript 动态填充 -->
                            </select>
                        </div>
                        
                        <!-- 交换语言按钮 -->
                        <div class="swap-container">
                            <button 
                                id="swapBtn" 
                                class="swap-btn" 
                                type="button"
                                title="交换源语言和目标语言"
                                aria-label="交换语言"
                            >
                                🔄
                            </button>
                        </div>
                        
                        <!-- 目标语言选择器 -->
                        <div class="language-selector">
                            <label for="targetLang" class="language-selector__label">
                                目标语言
                            </label>
                            <select id="targetLang" class="language-selector__select" aria-label="选择目标语言">
                                <!-- 语言选项将由 JavaScript 动态填充 -->
                            </select>
                        </div>
                    </section>
                    
                    <!-- 翻译区域 -->
                    <section class="translation-area" aria-label="翻译区域">
                        <!-- 源文本输入框 -->
                        <div class="text-box">
                            <h3 class="text-box__title">
                                <span class="text-box__icon" aria-hidden="true">📝</span>
                                源文本
                            </h3>
                            <textarea 
                                id="sourceText" 
                                class="text-box__textarea"
                                placeholder="在此输入文本，或点击麦克风按钮进行语音输入..."
                                aria-label="输入要翻译的文本"
                                rows="6"
                            ></textarea>
                            
                            <!-- 源文本控制按钮 -->
                            <div class="controls" role="group" aria-label="源文本操作">
                                <button 
                                    id="startMicBtn" 
                                    class="control-btn mic-btn" 
                                    type="button"
                                    aria-label="开始语音输入"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">🎤</span>
                                    <span class="control-btn__text">开始录音</span>
                                </button>
                                <button 
                                    id="stopMicBtn" 
                                    class="control-btn mic-btn stop-mic-btn" 
                                    type="button"
                                    aria-label="停止语音输入"
                                    style="display: none;"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">⏹️</span>
                                    <span class="control-btn__text">停止录音</span>
                                </button>
                                <button 
                                    id="clearSourceBtn" 
                                    class="control-btn clear-btn" 
                                    type="button"
                                    aria-label="清空源文本"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">🗑️</span>
                                    <span class="control-btn__text">清空</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- 目标文本显示框 -->
                        <div class="text-box">
                            <h3 class="text-box__title">
                                <span class="text-box__icon" aria-hidden="true">💬</span>
                                翻译结果
                            </h3>
                            <textarea 
                                id="targetText" 
                                class="text-box__textarea"
                                placeholder="翻译结果将显示在这里..."
                                aria-label="翻译结果"
                                readonly
                                rows="6"
                            ></textarea>
                            
                            <!-- 目标文本控制按钮 -->
                            <div class="controls" role="group" aria-label="翻译结果操作">
                                <button 
                                    id="speakTargetBtn" 
                                    class="control-btn speak-btn" 
                                    type="button"
                                    aria-label="朗读翻译结果"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">🔊</span>
                                    <span class="control-btn__text">朗读</span>
                                </button>
                                <button 
                                    id="copyTargetBtn" 
                                    class="control-btn copy-btn" 
                                    type="button"
                                    aria-label="复制翻译结果"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">📋</span>
                                    <span class="control-btn__text">复制</span>
                                </button>
                                <button 
                                    id="clearTargetBtn" 
                                    class="control-btn clear-btn" 
                                    type="button"
                                    aria-label="清空翻译结果"
                                >
                                    <span class="control-btn__icon" aria-hidden="true">🗑️</span>
                                    <span class="control-btn__text">清空</span>
                                </button>
                            </div>
                        </div>
                    </section>
                    
                    <!-- 翻译按钮区域 -->
                    <div class="translate-section">
                        <button 
                            id="translateBtn" 
                            class="translate-btn" 
                            type="button"
                            aria-label="执行翻译"
                        >
                            <span aria-hidden="true">🔄</span>
                            翻译
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- 对话翻译模式 -->
            <section id="conversationMode" class="mode-section" aria-label="对话翻译模式" style="display: none;">
                <!-- 对话区域 -->
                <div class="conversation">
                    <!-- 对话头部 -->
                    <header class="conversation__header">
                        <div class="conversation__lang-container">
                            <select id="convSourceLang" class="conversation__lang" aria-label="选择我的语言">
                                <!-- 语言选项将由 JavaScript 动态填充 -->
                            </select>
                            <button type="button" class="conversation__swap-btn" id="convSwapBtn" aria-label="交换语言">
                                🔄
                            </button>
                            <select id="convTargetLang" class="conversation__lang" aria-label="选择对方语言">
                                <!-- 语言选项将由 JavaScript 动态填充 -->
                            </select>
                        </div>
                        <div class="conversation__actions">
                            <button type="button" class="conversation__action-btn" id="convNewBtn" aria-label="新建对话">
                                <span class="conversation__action-btn__icon">➕</span>
                                <span>新建</span>
                            </button>
                            <button type="button" class="conversation__action-btn" id="convSaveBtn" aria-label="保存对话">
                                <span class="conversation__action-btn__icon">💾</span>
                                <span>保存</span>
                            </button>
                        </div>
                    </header>
                    
                    <!-- 消息区域 -->
                    <div class="conversation__messages" id="conversationMessages" role="log" aria-live="polite">
                        <!-- 消息将由 JavaScript 动态渲染 -->
                        <div class="message message--system">
                            <div class="message__content">
                                欢迎使用对话翻译模式！输入文本进行翻译，翻译结果会自动显示在对话中。
                            </div>
                        </div>
                    </div>
                    
                    <!-- 输入区域 -->
                    <footer class="conversation__input-area">
                        <div class="conversation__input-container">
                            <textarea 
                                id="convInput" 
                                class="conversation__input"
                                placeholder="输入要翻译的内容..."
                                aria-label="对话输入"
                            ></textarea>
                            <button type="button" class="conversation__send-btn" id="convSendBtn" aria-label="发送" disabled>
                                ➤
                            </button>
                        </div>
                        
                        <!-- 实时翻译预览区域 -->
                        <div class="conversation__preview" id="convPreview" style="display: none;">
                            <div class="conversation__preview__label">翻译预览：</div>
                            <div class="conversation__preview__content" id="convPreviewContent"></div>
                        </div>
                        
                        <div class="conversation__input-options">
                            <button type="button" class="conversation__option-btn" id="convMicBtn" aria-label="语音输入">
                                <span class="conversation__option-btn__icon">🎤</span>
                                <span>语音</span>
                            </button>
                            <button type="button" class="conversation__option-btn" id="convClearBtn" aria-label="清空对话">
                                <span class="conversation__option-btn__icon">🗑️</span>
                                <span>清空</span>
                            </button>
                            <div class="conversation__auto-translate">
                                <label class="conversation__auto-translate__label" for="autoTranslateToggle">
                                    实时翻译
                                </label>
                                <input 
                                    type="checkbox" 
                                    id="autoTranslateToggle" 
                                    class="conversation__auto-translate__toggle"
                                    checked
                                >
                            </div>
                        </div>
                    </footer>
                </div>
            </section>
        </div>
    </main>

    <!-- 历史记录面板 -->
    <aside class="history-panel" id="historyPanel" aria-label="历史记录">
        <header class="history-panel__header">
            <h2 class="history-panel__title">
                <span class="history-panel__title__icon" aria-hidden="true">📚</span>
                <span>历史记录</span>
            </h2>
            <button type="button" class="history-panel__close-btn" id="closeHistoryBtn" aria-label="关闭">
                ✕
            </button>
        </header>
        
        <!-- 搜索区域 -->
        <div class="history-panel__search">
            <input 
                type="text" 
                id="historySearch" 
                class="history-panel__search-input" 
                placeholder="搜索历史记录..."
                aria-label="搜索历史记录"
            >
        </div>
        
        <!-- 标签切换 -->
        <div class="history-panel__tabs" role="tablist">
            <button type="button" class="history-panel__tab history-panel__tab--active" data-tab="conversations" role="tab" aria-selected="true">
                对话 <span class="history-panel__tab-count" id="convCount">0</span>
            </button>
            <button type="button" class="history-panel__tab" data-tab="translations" role="tab" aria-selected="false">
                翻译 <span class="history-panel__tab-count" id="transCount">0</span>
            </button>
        </div>
        
        <!-- 列表容器 -->
        <div class="history-panel__list" id="historyList">
            <!-- 历史记录将由 JavaScript 动态渲染 -->
            <div class="history-panel__empty">
                <div class="history-panel__empty-icon">📭</div>
                <div class="history-panel__empty-text">暂无历史记录</div>
            </div>
        </div>
        
        <!-- 底部操作 -->
        <footer class="history-panel__footer">
            <button type="button" class="history-panel__footer-btn" id="exportHistoryBtn">
                📤 导出
            </button>
            <button type="button" class="history-panel__footer-btn history-panel__footer-btn--danger" id="clearAllHistoryBtn">
                🗑️ 清空
            </button>
        </footer>
    </aside>
    <div class="history-panel__overlay" id="historyOverlay"></div>

    <!-- 页脚区域 -->
    <footer class="footer">
        <div class="footer__content">
            <p class="footer__text">
                <span class="footer__icon" aria-hidden="true">💡</span>
                提示：请使用现代浏览器（Chrome、Edge、Safari）以获得最佳体验
            </p>
            <p class="footer__text">
                语音识别功能需要浏览器支持 Web Speech API
            </p>
        </div>
    </footer>
    
    <!-- JavaScript 模块 -->
    <script type="module" src="./js/app.js"></script>
    
    <!-- 降级处理（不支持 ES6 模块的浏览器） -->
    <script nomodule>
        document.addEventListener('DOMContentLoaded', function() {
            var status = document.getElementById('status');
            if (status) {
                status.className = 'status status--error';
                status.textContent = '您的浏览器不支持 ES6 模块，请使用现代浏览器访问此应用。';
                status.style.display = 'block';
            }
        });
    </script>
</body>
</html>

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: emr-postgres
    environment:
      POSTGRES_USER: emr_user
      POSTGRES_PASSWORD: emr_secure_password_2024
      POSTGRES_DB: emr_system
    ports:
      - "18725:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr_user -d emr_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  redis:
    image: redis:7-alpine
    container_name: emr-redis
    command: redis-server --appendonly yes --requirepass emr_redis_secure_2024
    ports:
      - "18726:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: emr-backend
    environment:
      NODE_ENV: production
      SERVER_PORT: 18723
      SERVER_HOST: 0.0.0.0
      JWT_SECRET: emr_jwt_secret_key_2024_docker_super_secure
      JWT_EXPIRES_IN: 24h
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: emr_user
      DB_PASSWORD: emr_secure_password_2024
      DB_NAME: emr_system
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: emr_redis_secure_2024
      WS_PORT: 18727
      CDSS_ENABLED: true
      CDSS_AUTO_VALIDATE: true
      E_SIGN_CA_ENABLED: true
      AUDIT_LOG_ENABLED: true
      LOG_LEVEL: info
    ports:
      - "18723:18723"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emr-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: emr-frontend
    ports:
      - "18724:80"
    depends_on:
      - backend
    networks:
      - emr-network
    restart: unless-stopped

networks:
  emr-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 密码
# requirepass yourpassword

# 超时时间
# timeout 0

# 数据库数量
databases 16

# RDB 持久化
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfsync everysec

# 最大内存
maxmemory 512mb
maxmemory-policy allkeys-lru

# 客户端连接数
maxclients 10000

# 日志级别
loglevel notice

# 日志文件
logfile ""

# 禁用保护模式
protected-mode no

# 守护进程模式
daemonize no

# 工作目录
dir /data
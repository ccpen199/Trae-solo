version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: guizhou-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Guizhou@2024
      MYSQL_DATABASE: guizhou_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - guizhou-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pGuizhou@2024"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgresql:
    image: postgres:16
    container_name: guizhou-postgres
    environment:
      POSTGRES_PASSWORD: Guizhou@2024
      POSTGRES_DB: guizhou_auth
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    networks:
      - guizhou-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.0-alpine
    container_name: guizhou-redis
    command: redis-server --requirepass Guizhou@2024 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - guizhou-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Guizhou@2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: guizhou-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: Guizhou@2024
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - guizhou-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/liveness | grep 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 3

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: guizhou-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-data:/root/namesrv/logs
      - rocketmq-namesrv-store:/root/namesrv/store
    networks:
      - guizhou-network
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: guizhou-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - rocketmq-broker-data:/root/broker/logs
      - rocketmq-broker-store:/root/broker/store
      - ./config/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    networks:
      - guizhou-network
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: guizhou-elasticsearch
    environment:
      - cluster.name=guizhou-cluster
      - node.name=guizhou-es-1
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - guizhou-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: guizhou-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Guizhou@2024
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/guizhou_auth
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: Guizhou@2024
      KC_HEALTH_ENABLED: true
    ports:
      - "8080:8080"
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - guizhou-network
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health/ready | grep 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: guizhou-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - guizhou-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: guizhou-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: Guizhou@2024
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - guizhou-network
    depends_on:
      - prometheus

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: guizhou-skywalking-oap
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - guizhou-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: guizhou-skywalking-ui
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8090:8080"
    networks:
      - guizhou-network
    depends_on:
      - skywalking-oap

  mongodb:
    image: mongo:7.0
    container_name: guizhou-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Guizhou@2024
      MONGO_INITDB_DATABASE: guizhou_certificate
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - guizhou-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-data:
  rocketmq-namesrv-store:
  rocketmq-broker-data:
  rocketmq-broker-store:
  es-data:
  prometheus-data:
  grafana-data:
  mongo-data:

networks:
  guizhou-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

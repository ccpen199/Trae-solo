<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 新闻资讯管理系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>📰 新闻资讯管理系统</h1>
        <p>请登录您的账户以继续</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
        </div>
        
        <div id="errorMessage" class="alert alert-error d-none"></div>
        
        <button type="submit" class="btn btn-primary btn-block">
          登录
        </button>
      </form>
      
      <div class="mt-4" style="text-align: center; font-size: 13px; color: #64748b;">
        <p>默认管理员账户: <strong>admin / admin123456</strong></p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (api.token) {
        try {
          await api.getProfile();
          window.location.href = '/dashboard';
        } catch (e) {
          api.setToken(null);
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      
      errorDiv.classList.add('d-none');
      
      try {
        const result = await api.login(username, password);
        
        if (result.success) {
          window.location.href = '/dashboard';
        }
      } catch (error) {
        errorDiv.textContent = error.message || '登录失败，请检查用户名和密码';
        errorDiv.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>

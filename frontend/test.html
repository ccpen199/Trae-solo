<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测试页面</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-router-dom@6.3.0/umd/react-router-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      console.log('React:', window.React);
      console.log('ReactDOM:', window.ReactDOM);
      console.log('ReactRouterDOM:', window.ReactRouterDOM);
      
      const { useState } = React;
      const { BrowserRouter, Routes, Route, Link } = window.ReactRouterDOM;
      
      function Home() {
        return <h1>首页</h1>;
      }
      
      function About() {
        return <h1>关于</h1>;
      }
      
      function App() {
        return (
          <BrowserRouter>
            <div>
              <nav>
                <Link to="/">首页</Link> | <Link to="/about">关于</Link>
              </nav>
              <Routes>
                <Route path="/" element={<Home />} />
                <Route path="/about" element={<About />} />
              </Routes>
            </div>
          </BrowserRouter>
        );
      }
      
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

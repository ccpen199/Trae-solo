<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI采购谈判助手 - 测试</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .test-box {
        background: white;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 600px;
        margin: 40px auto;
      }
      h1 {
        color: #1890ff;
        margin-top: 0;
      }
      .status {
        padding: 8px 16px;
        border-radius: 4px;
        margin: 16px 0;
      }
      .status.ok {
        background: #f6ffed;
        color: #52c41a;
        border: 1px solid #b7eb8f;
      }
      .api-test {
        margin-top: 24px;
      }
      button {
        background: #1890ff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #40a9ff;
      }
      pre {
        background: #fafafa;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="test-box">
      <h1>AI采购谈判助手 - 页面测试</h1>
      <div class="status ok">
        ✅ 前端基础页面加载成功！
      </div>
      <p>如果能看到这个页面，说明Vite服务正常工作。</p>
      
      <div class="api-test">
        <h3>后端API测试</h3>
        <button onclick="testApi()">测试健康检查接口</button>
        <div id="api-result" style="margin-top: 12px;"></div>
      </div>
    </div>
    
    <script>
      async function testApi() {
        const resultEl = document.getElementById('api-result');
        resultEl.innerHTML = '<p>正在测试...</p>';
        
        try {
          const response = await fetch('/api/health');
          const data = await response.json();
          resultEl.innerHTML = '<p>✅ API连接成功！</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        } catch (error) {
          resultEl.innerHTML = '<p>❌ API连接失败: ' + error.message + '</p>';
        }
      }
    </script>
  </body>
</html>

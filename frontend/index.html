
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B 数字货运调度平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #f5f7fa; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .nav { background: #2c3e50; color: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .nav-brand { font-size: 1.25rem; font-weight: bold; }
    .nav-links { display: flex; gap: 20px; }
    .nav-link { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; transition: background 0.3s; }
    .nav-link:hover, .nav-link.active { background: #34495e; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary { background: #3498db; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: #95a5a6; color: white; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .grid { display: grid; gap: 20px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .stats-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    .stats-number { font-size: 2rem; font-weight: bold; color: #3498db; margin-bottom: 8px; }
    .stats-label { color: #666; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    .table th { background: #f8f9fa; font-weight: 600; color: #333; }
    .table tr:hover { background: #f8f9fa; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge-published { background: #3498db; color: white; }
    .badge-accepted { background: #f39c12; color: white; }
    .badge-picked_up { background: #9b59b6; color: white; }
    .badge-in_transit { background: #e67e22; color: white; }
    .badge-delivered { background: #27ae60; color: white; }
    .auth-container { max-width: 400px; margin: 80px auto; }
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .auth-tab.active { border-bottom-color: #3498db; color: #3498db; font-weight: 600; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .tab { padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { border-bottom-color: #3498db; color: #3498db; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

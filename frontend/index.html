<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XX网视频播放器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #111827;
        color: white;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem;
      }
      .header {
        background: #1f2937;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        padding: 1rem 0;
      }
      .header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: white;
      }
      .logo-icon {
        width: 2.5rem;
        height: 2.5rem;
        background: #ef4444;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-text {
        font-size: 1.25rem;
        font-weight: bold;
        color: white;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .search-box {
        position: relative;
      }
      .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        width: 1.25rem;
        height: 1.25rem;
      }
      .search-input {
        padding: 0.5rem 0.5rem 0.5rem 2.5rem;
        background: #374151;
        border: none;
        border-radius: 0.5rem;
        color: white;
        width: 16rem;
        outline: none;
      }
      .search-input:focus {
        ring: 2px solid #ef4444;
      }
      .admin-link {
        color: #9ca3af;
        padding: 0.5rem 1rem;
      }
      .admin-link:hover {
        color: white;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .section-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        margin-bottom: 1.5rem;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      @media (min-width: 768px) {
        .video-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .video-card {
        cursor: pointer;
        transition: transform 0.2s;
      }
      .video-card:hover {
        transform: scale(1.05);
      }
      .video-thumbnail {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 0.5rem;
        overflow: hidden;
        margin-bottom: 0.75rem;
      }
      .video-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0);
        opacity: 0;
        transition: all 0.2s;
      }
      .video-card:hover .play-overlay {
        background: rgba(0,0,0,0.3);
        opacity: 1;
      }
      .vip-badge {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem 0.5rem;
        background: #fbbf24;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 500;
        color: black;
      }
      .video-card h3 {
        font-weight: 500;
        margin-bottom: 0.25rem;
        color: white;
      }
      .video-card:hover h3 {
        color: #ef4444;
      }
      .video-card p {
        font-size: 0.875rem;
        color: #9ca3af;
      }
      .promo-banner {
        margin-top: 3rem;
        background: linear-gradient(to right, #f59e0b, #fbbf24);
        border-radius: 1rem;
        padding: 2rem;
      }
      .promo-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .promo-title {
        font-size: 1.875rem;
        font-weight: bold;
        color: black;
        margin-bottom: 0.5rem;
      }
      .promo-description {
        color: rgba(0,0,0,0.8);
        font-size: 1.125rem;
      }
      .promo-button {
        padding: 0.75rem 2rem;
        background: black;
        color: #fbbf24;
        font-weight: bold;
        border-radius: 0.5rem;
        cursor: pointer;
        border: none;
      }
      footer {
        background: #1f2937;
        margin-top: 3rem;
        padding: 2rem 0;
        text-align: center;
      }
      footer p {
        color: #9ca3af;
      }
      .loading-skeleton {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      @media (min-width: 768px) {
        .loading-skeleton {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .skeleton-item {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .skeleton-thumbnail {
        aspect-ratio: 16 / 9;
        background: #374151;
        border-radius: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .skeleton-title {
        height: 1rem;
        background: #374151;
        border-radius: 0.25rem;
        width: 75%;
        margin-bottom: 0.5rem;
      }
      .skeleton-desc {
        height: 0.75rem;
        background: #374151;
        border-radius: 0.25rem;
        width: 50%;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .video-player {
        position: relative;
        width: 100%;
        background: black;
        aspect-ratio: 16 / 9;
      }
      .video-player.aspect-4-3 {
        aspect-ratio: 4 / 3;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .player-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        padding: 1rem;
        transition: opacity 0.3s;
      }
      .progress-bar {
        position: relative;
        width: 100%;
        height: 6px;
        background: #374151;
        border-radius: 3px;
        cursor: pointer;
        margin-bottom: 1rem;
      }
      .progress-buffered {
        position: absolute;
        height: 100%;
        background: #6b7280;
        border-radius: 3px;
      }
      .progress-played {
        position: absolute;
        height: 100%;
        background: #ef4444;
        border-radius: 3px;
      }
      .progress-handle {
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        background: #ef4444;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .progress-bar:hover .progress-handle {
        opacity: 1;
      }
      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .controls-left, .controls-right {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .control-btn {
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .control-btn:hover {
        color: #ef4444;
      }
      .volume-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .time-display {
        font-size: 0.875rem;
        color: #d1d5db;
      }
      .ad-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: black;
      }
      .ad-top {
        position: absolute;
        top: 1rem;
        left: 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .ad-title {
        position: absolute;
        bottom: 5rem;
        left: 1rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: white;
      }
      .skip-btn {
        background: rgba(0,0,0,0.7);
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        color: #fbbf24;
        font-weight: 500;
        border: none;
        cursor: pointer;
      }
      .vip-modal {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.9);
        z-index: 9999;
        pointer-events: auto;
      }
      .vip-content {
        background: #1f2937;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 24rem;
        text-align: center;
      }
      .vip-icon {
        color: #fbbf24;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
      }
      .vip-modal-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        color: white;
      }
      .vip-modal-desc {
        color: #9ca3af;
        margin-bottom: 1.5rem;
      }
      .vip-modal-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }
      .vip-modal-buttons button {
        padding: 0.5rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        border: none;
        cursor: pointer;
      }
      .btn-cancel {
        background: #4b5563;
        color: white;
        cursor: pointer;
        pointer-events: auto;
        transition: background 0.2s;
      }
      .btn-cancel:hover {
        background: #6b7280;
      }
      .btn-vip {
        background: #fbbf24;
        color: black;
        cursor: pointer;
        pointer-events: auto;
        transition: background 0.2s;
      }
      .btn-vip:hover {
        background: #f59e0b;
      }
      .quality-menu, .settings-menu {
        position: absolute;
        bottom: 100%;
        right: 0;
        background: #1f2937;
        border-radius: 0.5rem;
        padding: 0.5rem 0;
        min-width: 8rem;
        margin-bottom: 0.5rem;
      }
      .quality-menu button, .settings-menu button {
        width: 100%;
        padding: 0.5rem 1rem;
        text-align: left;
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
      }
      .quality-menu button.active {
        color: #ef4444;
      }
      .video-page {
        min-height: 100vh;
        background: #111827;
      }
      .video-page-container {
        max-width: 1024px;
        margin: 0 auto;
        padding: 1rem;
      }
      .video-info-section {
        margin-top: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .video-page-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        margin-bottom: 0.5rem;
      }
      .video-page-desc {
        color: #9ca3af;
      }
      .related-section {
        margin-top: 2rem;
      }
      .related-title {
        font-size: 1.25rem;
        font-weight: bold;
        color: white;
        margin-bottom: 1rem;
      }
      .related-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      @media (min-width: 768px) {
        .related-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

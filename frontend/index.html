<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pharmacy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>药房进销存管理系统 - Pharmacy ERP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .login-title {
        text-align: center;
        margin-bottom: 32px;
        color: #1a1a2e;
      }
      .login-title h1 {
        margin-bottom: 8px;
        font-size: 28px;
        font-weight: 600;
      }
      .login-title p {
        color: #666;
        font-size: 14px;
      }
      .main-layout {
        min-height: 100vh;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: #001529;
        color: white;
        height: 64px;
      }
      .header-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
      }
      .header-user {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar {
        background: #001529;
        min-height: calc(100vh - 64px);
      }
      .content-container {
        padding: 24px;
        background: #f0f2f5;
        min-height: calc(100vh - 64px);
      }
      .page-header {
        margin-bottom: 24px;
      }
      .page-header h2 {
        margin-bottom: 4px;
        color: #1a1a2e;
      }
      .page-header p {
        color: #666;
        font-size: 14px;
      }
      .stat-card {
        padding: 24px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
      }
      .stat-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transform: translateY(-2px);
      }
      .stat-card .stat-value {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .stat-card .stat-label {
        color: #666;
        font-size: 14px;
      }
      .alert-card {
        border-left: 4px solid #ff4d4f;
        background: #fff2f0;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .alert-card.warning {
        border-left-color: #faad14;
        background: #fffbe6;
      }
      .alert-card.info {
        border-left-color: #1890ff;
        background: #e6f7ff;
      }
      .table-container {
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .form-container {
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 400px;
      }
      .badge-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .badge-success { background: #52c41a; }
      .badge-warning { background: #faad14; }
      .badge-danger { background: #ff4d4f; }
      .badge-info { background: #1890ff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

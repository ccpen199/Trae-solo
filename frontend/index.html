<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上海一网通办移动端后台服务中枢</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">随申码统一身份凭证</p>
          <h1>上海一网通办移动端后台服务中枢</h1>
        </div>
        <nav>
          <a href="#services">高频服务</a>
          <a href="#profile">个人中心</a>
          <a href="#reminders">主动推送</a>
          <a href="#admin">管理后台</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div>
            <span class="status" id="healthStatus">后端连接中</span>
            <h2>以随申码打通电子证照、三金、健康档案和信用报告</h2>
            <p>统一身份、统一授权、统一推送，面向移动端提供可复验的办事与数据服务链路。</p>
          </div>
          <div class="code-card">
            <strong id="codeValue">SH-SSM-2026-0001</strong>
            <span>当前凭证</span>
            <button id="loginBtn">模拟登录</button>
          </div>
        </section>

        <section class="metrics" id="metrics"></section>

        <section class="panel" id="services">
          <div class="section-head">
            <div>
              <p class="eyebrow">服务目录</p>
              <h2>高频个人数据服务</h2>
            </div>
            <div class="filters">
              <input id="keyword" type="search" placeholder="搜索服务、证照、三金" />
              <select id="category">
                <option value="">全部分类</option>
                <option>身份凭证</option>
                <option>电子证照</option>
                <option>个人数据</option>
                <option>健康数据</option>
                <option>信用服务</option>
                <option>主动提醒</option>
              </select>
              <button id="searchBtn">查询</button>
            </div>
          </div>
          <div class="cards" id="serviceList"></div>
        </section>

        <section class="grid-two">
          <div class="panel" id="profile">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">个人中心</p>
                <h2>我的证照与办件</h2>
              </div>
              <button id="submitBtn">提交示例办件</button>
            </div>
            <div id="profileBox"></div>
            <div class="list" id="certificateList"></div>
            <div class="list" id="applicationList"></div>
          </div>

          <div class="panel" id="reminders">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">主动式服务</p>
                <h2>推送提醒</h2>
              </div>
              <button id="createReminderBtn">新增提醒</button>
            </div>
            <div class="list" id="reminderList"></div>
          </div>
        </section>

        <section class="panel" id="admin">
          <div class="section-head">
            <div>
              <p class="eyebrow">后台管理</p>
              <h2>数据服务运行态势</h2>
            </div>
            <span class="api" id="apiLabel"></span>
          </div>
          <div class="metrics" id="adminMetrics"></div>
          <div class="list" id="auditList"></div>
        </section>
      </main>
    </div>

    <script src="/api-config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>

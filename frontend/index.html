<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社交关系链服务</title>
    <script src="./react.min.js"></script>
    <script src="./react-dom.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
      .app { min-height: 100vh; display: flex; }
      .sidebar { width: 200px; background: #fff; border-right: 1px solid #e8e8e8; padding: 20px 0; }
      .sidebar h2 { padding: 0 20px 20px; font-size: 18px; border-bottom: 1px solid #e8e8e8; }
      .sidebar nav a { display: block; padding: 12px 20px; color: #666; text-decoration: none; transition: all 0.2s; cursor: pointer; }
      .sidebar nav a:hover, .sidebar nav a.active { background: #f5f5f5; color: #1890ff; }
      .main { flex: 1; padding: 24px; overflow-y: auto; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e8e8e8; }
      .header h1 { font-size: 24px; }
      .user-select { display: flex; align-items: center; gap: 12px; }
      .user-select select { padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 4px; background: #fff; }
      .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
      .card h3 { margin-bottom: 16px; font-size: 16px; }
      .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .stat-card { text-align: center; padding: 20px; background: #f5f5f5; border-radius: 8px; }
      .stat-card .value { font-size: 32px; font-weight: bold; color: #1890ff; }
      .stat-card .label { color: #666; margin-top: 8px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #e8e8e8; }
      .tab { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tab.active { color: #1890ff; border-bottom-color: #1890ff; }
      .filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .filter-bar select { padding: 6px 12px; border: 1px solid #e8e8e8; border-radius: 4px; background: #fff; }
      .empty { text-align: center; padding: 40px; color: #999; }
      .loading { text-align: center; padding: 40px; color: #999; }
      .user-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
      .user-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 16px; }
      .user-card .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .user-card .avatar { width: 48px; height: 48px; border-radius: 50%; background: #1890ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
      .user-card .user-name { font-weight: 600; }
      .user-card .user-username { color: #666; font-size: 14px; }
      .user-card .user-bio { color: #666; font-size: 14px; margin-bottom: 12px; }
      .user-card .user-stats { display: flex; gap: 16px; font-size: 13px; color: #666; margin-bottom: 12px; flex-wrap: wrap; }
      .user-card .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn { padding: 6px 16px; border: 1px solid #e8e8e8; border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s; }
      .btn:hover { border-color: #1890ff; color: #1890ff; }
      .btn-primary { background: #1890ff; color: #fff; border-color: #1890ff; }
      .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }
      .btn-danger { color: #ff4d4f; border-color: #ff4d4f; }
      .btn-danger:hover { background: #ff4d4f; color: #fff; }
      .mutual { color: #52c41a; font-size: 12px; }
      .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
      .pagination button { padding: 6px 12px; border: 1px solid #e8e8e8; border-radius: 4px; background: #fff; cursor: pointer; }
      .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
      .pagination span { color: #666; }
      .recommend-reason { background: #f0f5ff; padding: 8px 12px; border-radius: 4px; font-size: 13px; color: #1890ff; margin-top: 8px; }
      .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
      .modal { background: #fff; border-radius: 8px; padding: 24px; width: 400px; max-width: 90%; }
      .modal h3 { margin-bottom: 16px; }
      .modal textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #e8e8e8; border-radius: 4px; resize: vertical; margin-bottom: 16px; font-family: inherit; }
      .modal select { width: 100%; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 4px; margin-bottom: 16px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .report-item, .risk-item { border-bottom: 1px solid #e8e8e8; padding: 16px 0; }
      .report-item:last-child, .risk-item:last-child { border-bottom: none; }
      .report-header, .risk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .report-type, .risk-type { font-weight: 600; }
      .report-status, .risk-status { padding: 4px 12px; border-radius: 4px; font-size: 12px; }
      .status-pending { background: #fff7e6; color: #fa8c16; }
      .status-processing { background: #e6f7ff; color: #1890ff; }
      .status-resolved { background: #f6ffed; color: #52c41a; }
      .status-rejected { background: #fff1f0; color: #ff4d4f; }
      .report-content, .risk-content { color: #666; margin-bottom: 8px; }
      .report-meta, .risk-meta { font-size: 13px; color: #999; }
      .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
      .dashboard-stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
      .dashboard-stat-card .label { color: #666; font-size: 14px; margin-bottom: 8px; }
      .dashboard-stat-card .value { font-size: 28px; font-weight: bold; color: #1890ff; }
      .dashboard-stat-card .change { font-size: 13px; margin-top: 4px; }
      .change-up { color: #52c41a; }
      .change-down { color: #ff4d4f; }
      .chart-container { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
      .chart-container h3 { margin-bottom: 16px; font-size: 16px; }
      .filters { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
      .filters input, .filters select { padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 4px; background: #fff; }
      .risk-level-high { color: #ff4d4f; }
      .risk-level-medium { color: #fa8c16; }
      .risk-level-low { color: #52c41a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./app-full.js"></script>
  </body>
</html>

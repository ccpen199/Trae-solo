<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinAI 本地服务台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local SQLite Full Stack</p>
          <h1 id="projectTitle">PinAI 本地服务台</h1>
        </div>
        <nav>
          <a href="#search">搜索筛选</a>
          <a href="#purchase">流程提交</a>
          <a href="#profile">个人中心</a>
          <a href="#admin">后台管理</a>
        </nav>
      </header>

      <main>
        <section class="status-band">
          <div>
            <span class="label">前端</span>
            <strong id="frontendUrl">-</strong>
          </div>
          <div>
            <span class="label">后端</span>
            <strong id="backendUrl">-</strong>
          </div>
          <div>
            <span class="label">健康检查</span>
            <strong id="healthState">检查中</strong>
          </div>
        </section>

        <section id="auth" class="panel two-col">
          <div>
            <p class="eyebrow">登录注册</p>
            <h2>演示账号快速进入</h2>
            <p class="muted">可使用 13800138000 或直接注册新手机号，登录后会写入本地状态。</p>
          </div>
          <form id="loginForm" class="form-grid">
            <input name="name" placeholder="姓名" value="演示用户" />
            <input name="phone" placeholder="手机号" value="13800138000" />
            <button type="submit">登录 / 注册</button>
          </form>
        </section>

        <section id="search" class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">搜索 / 筛选</p>
              <h2>服务与方案</h2>
            </div>
            <div class="filters">
              <input id="searchInput" placeholder="搜索资产、预算、账本、报销" />
              <select id="categorySelect">
                <option>全部</option>
              </select>
              <button id="resetFilters" type="button">重置筛选</button>
            </div>
          </div>
          <div id="serviceList" class="cards"></div>
        </section>

        <section id="purchase" class="panel two-col">
          <div>
            <p class="eyebrow">流程 / 提交</p>
            <h2>提交购买或业务需求</h2>
            <p class="muted">表单会调用后端接口并写入 SQLite，后台管理、个人中心和流程状态会立即刷新。</p>
          </div>
          <form id="orderForm" class="form-grid">
            <select name="serviceId" id="serviceSelect"></select>
            <input name="customer" placeholder="联系人" value="演示用户" />
            <input name="phone" placeholder="联系电话" value="13800138000" />
            <textarea name="note" placeholder="需求说明">请安排顾问跟进本次服务。</textarea>
            <button id="orderSubmit" type="submit">提交流程</button>
          </form>
        </section>

        <section id="submit" class="panel two-col">
          <div>
            <p class="eyebrow">需求提交</p>
            <h2>没有合适服务时创建需求</h2>
          </div>
          <form id="submissionForm" class="form-grid">
            <input name="title" placeholder="需求标题" value="现金流诊断需求" />
            <input name="contact" placeholder="联系方式" value="13800138000" />
            <textarea name="detail" placeholder="详细描述">希望按月分析收支并给出提醒规则。</textarea>
            <button type="submit">提交需求</button>
          </form>
        </section>

        <section id="profile" class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">个人中心 / 我的</p>
              <h2>我的订单与资料</h2>
            </div>
            <button id="refreshProfile" type="button">刷新</button>
          </div>
          <div id="profileBox" class="profile-grid"></div>
          <div id="ordersBox" class="list"></div>
        </section>

        <section id="admin" class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">后台管理</p>
              <h2>运营看板</h2>
            </div>
            <button id="refreshAdmin" type="button">刷新后台</button>
          </div>
          <div id="adminStats" class="stats"></div>
          <div id="adminTalentPanel" class="admin-grid"></div>
          <div id="adminLogs" class="list"></div>
        </section>

        <section class="panel">
          <p class="eyebrow">接口响应</p>
          <pre id="resultBox">等待操作...</pre>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>

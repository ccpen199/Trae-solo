<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>快递全链路协同开放平台</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      #boot-skeleton {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1677ff 0%, #0958d9 50%, #003eb3 100%);
        color: #fff; padding: 24px;
      }
      .boot-card {
        background: #fff; color: #333;
        padding: 40px; border-radius: 16px;
        max-width: 480px; width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      }
      .boot-title { font-size: 20px; font-weight: 700; color: #1677ff; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
      }
      .boot-dot {
        width: 32px; height: 32px; border-radius: 8px;
        background: linear-gradient(135deg, #1677ff, #0958d9);
        display: inline-flex; align-items: center; justify-content: center;
        color: #fff; font-size: 18px;
      }
      .boot-loading {
        margin-top: 20px; padding: 16px; background: #f0f7ff; border-radius: 10px;
        border: 1px solid #bae0ff;
      }
      .boot-spinner {
        display: inline-block; width: 16px; height: 16px;
        border: 2px solid #e6f4ff;
        border-top-color: #1677ff;
        border-radius: 50%; animation: boot-spin 0.8s linear infinite;
        vertical-align: middle; margin-right: 8px;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-accounts { margin-top: 16px; font-size: 13px; color: #595959; line-height: 1.8; }
      .boot-tag { display: inline-block; padding: 2px 8px; background: #f0f7ff; color: #1677ff; border-radius: 4px; font-size: 12px; margin-right: 6px;
      }
      .boot-noscript {
        background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322;
        padding: 16px; border-radius: 10px; margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 初始加载骨架：JS 加载完成前显示，避免白屏 -->
      <div id="boot-skeleton">
        <div class="boot-card">
          <div class="boot-title">
            <span class="boot-dot">🚚</span>
            快递全链路协同开放平台
          </div>
          <div style="color: #8c8c8c; font-size: 13px; line-height: 1.6;">
            连接 30+ 快递品牌 · 一站式智能物流协同
          </div>
          <div class="boot-loading">
            <span class="boot-spinner"></span>
            <span style="color: #1677ff; font-size: 13px;">页面加载中，请稍候...</span>
          </div>
          <div class="boot-accounts">
            <div style="font-weight: 600; color: #262626; margin-bottom: 6px;">🎯 演示账号（密码均为 123456）</div>
            <div><span class="boot-tag">管理员</span> admin → 运营管理台 / 品牌质量 / 网点拓扑 / API中心</div>
            <div><span class="boot-tag">用户</span> user1 → 运单管理 / 智能发件 / 比价引擎</div>
            <div><span class="boot-tag">快递员</span> courier1 → 工作台 / 电子签收 / 投诉SLA</div>
          </div>
          <noscript>
            <div class="boot-noscript">
              <div style="font-weight: 600; margin-bottom: 6px;">⚠️ JavaScript 已禁用</div>
              <div style="font-size: 12px; line-height: 1.6;">
                本平台需要启用 JavaScript 才能正常运行。请在浏览器设置中启用 JavaScript 后刷新页面。
              </div>
            </div>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // React 挂载后移除骨架屏
      window.addEventListener('load', function() {
        setTimeout(function() {
          var skel = document.getElementById('boot-skeleton');
          if (skel && document.getElementById('root').children.length > 1) {
            skel.style.display = 'none';
          }
        }, 500);
      });
    </script>
  </body>
</html>

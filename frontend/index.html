<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园外卖配送系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
    }
    #app {
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #fff;
      min-height: 100vh;
    }
    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .page-header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: #f0f0f0;
      color: #333;
    }
    .btn-danger {
      background-color: #ff4d4f;
      color: white;
    }
    .btn-success {
      background-color: #52c41a;
      color: white;
    }
    .btn-block {
      width: 100%;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #666;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }
    .input-with-btn {
      display: flex;
      gap: 10px;
    }
    .input-with-btn .form-input {
      flex: 1;
    }
    .input-with-btn .btn {
      white-space: nowrap;
      padding: 0 16px;
      font-size: 14px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .card-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-available { background: #e6f7ff; color: #1890ff; }
    .badge-pending { background: #fff7e6; color: #fa8c16; }
    .badge-delivery { background: #f6ffed; color: #52c41a; }
    .badge-completed { background: #f0f0f0; color: #666; }
    .info-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .info-label {
      color: #999;
      width: 80px;
      flex-shrink: 0;
    }
    .info-value {
      color: #333;
      flex: 1;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: white;
      display: flex;
      border-top: 1px solid #eee;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .nav-item.active {
      color: #667eea;
    }
    .nav-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .nav-text {
      font-size: 12px;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin: 20px;
      max-width: 400px;
      width: 100%;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }
    .modal-content {
      margin-bottom: 20px;
    }
    .modal-footer {
      display: flex;
      gap: 12px;
    }
    .modal-footer .btn {
      flex: 1;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .alert-warning {
      background: #fff7e6;
      color: #fa8c16;
      border: 1px solid #ffd591;
    }
    .alert-error {
      background: #fff2f0;
      color: #ff4d4f;
      border: 1px solid #ffccc7;
    }
    .alert-success {
      background: #f6ffed;
      color: #52c41a;
      border: 1px solid #b7eb8f;
    }
    .tab-header {
      display: flex;
      background: white;
      border-bottom: 1px solid #eee;
    }
    .tab-item {
      flex: 1;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-bottom: 2px solid transparent;
    }
    .tab-item.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .file-upload {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .file-upload:hover {
      border-color: #667eea;
      background: #faf5ff;
    }
    .file-upload.has-file {
      border-style: solid;
    }
    .upload-preview {
      max-width: 100%;
      max-height: 150px;
      border-radius: 8px;
    }
    .upload-text {
      color: #999;
      font-size: 14px;
    }
    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .tag-pending { background: #fff7e6; color: #fa8c16; }
    .tag-approved { background: #f6ffed; color: #52c41a; }
    .tag-rejected { background: #fff2f0; color: #ff4d4f; }
    .toggle-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .toggle-label {
      font-size: 14px;
      color: #333;
    }
    .toggle {
      position: relative;
      width: 50px;
      height: 28px;
      background: #ccc;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle.active {
      background: #667eea;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      transition: left 0.3s;
    }
    .toggle.active::after {
      left: 24px;
    }
    .select-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    .time-input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .time-input-group .form-input {
      flex: 1;
      text-align: center;
    }
    .time-separator {
      color: #999;
    }
    .page-content {
      padding-bottom: 80px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .earnings {
      font-size: 18px;
      font-weight: 600;
      color: #ff4d4f;
    }
    .distance-info {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .distance-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #999;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    .action-buttons .btn {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>may-89229 Service Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Local full-stack repair</p>
          <h1>may-89229 Service Console</h1>
          <p class="summary">Frontend, backend, and SQLite are running inside this project path.</p>
        </div>
        <div class="status-pill" id="connectionStatus">Checking API</div>
      </section>

      <section class="grid" id="metricGrid" aria-label="Service metrics"></section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Runtime</p>
            <h2>Repair workflow</h2>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div class="table" id="workItems"></div>
      </section>

      <section class="panel compact">
        <h2>API response</h2>
        <pre id="apiPayload">Loading...</pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>

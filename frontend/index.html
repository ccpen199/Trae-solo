<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山东省文旅场所智慧监管服务平台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">鲁</span>
          <div>
            <strong>文旅监管</strong>
            <small>智慧场所服务平台</small>
          </div>
        </div>
        <nav>
          <button class="nav active" data-view="dashboard">监管大屏</button>
          <button class="nav" data-view="places">场所备案</button>
          <button class="nav" data-view="verification">实名核验</button>
          <button class="nav" data-view="reservation">预约分流</button>
          <button class="nav" data-view="alarms">AI告警</button>
          <button class="nav" data-view="inspection">巡检任务</button>
          <button class="nav" data-view="analytics">经营分析</button>
          <button class="nav" data-view="system">后台管理</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>山东省文旅场所智慧监管服务平台</h1>
            <p>场所备案、人员核验、预约限流、AI告警、巡检闭环和经营数据分析</p>
          </div>
          <div class="session">
            <span id="healthDot"></span>
            <span id="healthText">检查服务中</span>
            <button id="loginBtn">双因素登录</button>
          </div>
        </header>

        <section id="dashboard" class="view active">
          <div id="metrics" class="metrics"></div>
          <div class="grid two">
            <section class="panel">
              <div class="panel-head">
                <h2>全省场所分布</h2>
                <select id="cityFilter">
                  <option value="">全部城市</option>
                </select>
              </div>
              <div id="heatmap" class="bars"></div>
            </section>
            <section class="panel">
              <h2>实时风险态势</h2>
              <div id="trend" class="trend"></div>
            </section>
          </div>
        </section>

        <section id="places" class="view">
          <div class="panel">
            <div class="panel-head">
              <h2>场所备案管理</h2>
              <div class="tools">
                <input id="placeSearch" placeholder="搜索场所、城市或备案号" />
                <select id="placeStatus">
                  <option value="">全部状态</option>
                  <option>在线</option>
                  <option>待审核</option>
                  <option>整改中</option>
                </select>
                <button id="newPlaceBtn">新增备案</button>
              </div>
            </div>
            <div id="placesTable" class="table"></div>
          </div>
        </section>

        <section id="verification" class="view">
          <div class="panel">
            <h2>实名核验记录</h2>
            <div id="verificationList" class="cards"></div>
          </div>
        </section>

        <section id="reservation" class="view">
          <div class="panel">
            <h2>预约分流管理</h2>
            <div id="reservationList" class="cards"></div>
          </div>
        </section>

        <section id="alarms" class="view">
          <div class="panel">
            <div class="panel-head">
              <h2>AI告警中心</h2>
              <div class="tools">
                <select id="alarmLevel">
                  <option value="">全部级别</option>
                  <option>高</option>
                  <option>中</option>
                  <option>低</option>
                </select>
                <button id="refreshAlarms">刷新</button>
              </div>
            </div>
            <div id="alarmList" class="cards"></div>
          </div>
        </section>

        <section id="inspection" class="view">
          <div class="panel">
            <div class="panel-head">
              <h2>巡检任务管理</h2>
              <button id="newInspectionBtn">派发巡检</button>
            </div>
            <div id="inspectionList" class="table"></div>
          </div>
        </section>

        <section id="analytics" class="view">
          <div class="grid two">
            <section class="panel">
              <h2>经营数据分析</h2>
              <div id="businessChart" class="bars"></div>
            </section>
            <section class="panel">
              <h2>告警类型统计</h2>
              <div id="alarmTypeChart" class="bars"></div>
            </section>
          </div>
        </section>

        <section id="system" class="view">
          <div class="grid three">
            <section class="panel">
              <div class="panel-head">
                <h2>用户账号审核</h2>
                <button id="refreshUsers">刷新账号</button>
              </div>
              <div id="userList" class="cards"></div>
            </section>
            <section class="panel">
              <h2>角色权限矩阵</h2>
              <div id="roleList" class="cards"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>安全审计日志</h2>
                <select id="auditModule">
                  <option value="">全部模块</option>
                  <option>后台管理</option>
                  <option>登录认证</option>
                  <option>场所备案</option>
                  <option>AI告警处置</option>
                  <option>巡检任务</option>
                  <option>系统初始化</option>
                </select>
              </div>
              <div id="auditList" class="cards"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <form id="modalForm" class="dialog">
        <h2 id="modalTitle">提交</h2>
        <div id="modalFields"></div>
        <div class="dialog-actions">
          <button type="button" id="cancelModal">取消</button>
          <button type="submit">提交</button>
        </div>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
